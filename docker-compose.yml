version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: verdades-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4311
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama2}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      MAX_CODE_SIZE: ${MAX_CODE_SIZE:-51200}
      AI_TIMEOUT: ${AI_TIMEOUT:-30000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://verdades.barbudas.com}
    ports:
      - '4311:4311'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: verdades-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 4310
      HOSTNAME: 0.0.0.0
      # URL interna para comunicação entre containers
      NEXT_PUBLIC_BACKEND_URL: http://backend:4311
      NEXT_PUBLIC_API_TIMEOUT: ${NEXT_PUBLIC_API_TIMEOUT:-30000}
    ports:
      - '4310:4310'
